name: hood-hotel

services:
  postgres:
    image: postgres:17-alpine
    container_name: hood-hotel-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hood_hotel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hood-network

  redis:
    image: redis:7-alpine
    container_name: hood-hotel-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hood-network

  backend:
    image: ${BACKEND_IMAGE:-hood-hotel-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hood-hotel-api
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hood_hotel}?schema=public
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      NODE_ENV: production
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hood-network

  frontend:
    image: ${FRONTEND_IMAGE:-hood-hotel-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hood-hotel-web
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - hood-network

  nginx:
    image: nginx:1.27-alpine
    container_name: hood-hotel-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl/certbot/www:/var/www/certbot:ro
      - ./docker/ssl/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - hood-network

  certbot:
    image: certbot/certbot:latest
    container_name: hood-hotel-certbot
    profiles:
      - ssl
    volumes:
      - ./docker/ssl/certbot/www:/var/www/certbot
      - ./docker/ssl/certbot/conf:/etc/letsencrypt
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${CERTBOT_EMAIL:-admin@thehoodhotel.com} --agree-tos --no-eff-email -d ${DOMAIN:-thehoodhotel.com} -d www.${DOMAIN:-thehoodhotel.com}

networks:
  hood-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
